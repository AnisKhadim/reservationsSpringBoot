<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <title>Header fragment</title>
</head>
<body>
<header class="navbar navbar-inverse navbar-fixed-top" th:fragment="header">
  <div class="container">
    <div class="navbar-header">
      <h1><a class="navbar-brand" href="#" th:href="@{/}">Réservations</a></h1>
    </div>
    <div class="navbar-collapse collapse">
      <ul class="nav navbar-nav">
        <li th:classappend="${module == 'home' ? 'active' : ''}">
          <a href="#" th:href="@{/}">Home</a>
        </li>
        <li th:classappend="${module == 'artists' ? 'active' : ''}">
          <a href="#" th:href="@{/artists}">Artists</a>
        </li>
      </ul>
    </div>
    <div style="float:right">
      <div sec:authorize="!isAuthenticated()">
        <p>Vous n'êtes pas connecté.</p>
        <p><a th:href="@{/login}">Se connecter</a></p>
        <p><a th:href="@{/register}">S'inscrire</a></p>
      </div>
      <div sec:authorize="isAuthenticated()">
        <p>Bonjour <span sec:authentication="principal.username">Bob</span> !</p>
        <form th:action="@{/logout}" method="post">
          <button type="submit">Se déconnecter</button>
        </form>
      </div>
    </div>
  </div>
</header>
</body>
</html>
